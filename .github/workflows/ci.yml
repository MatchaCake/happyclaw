name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            container/agent-runner/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
          npm --prefix container/agent-runner ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Check changed-file formatting
        run: npm run format:check
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Audit production dependency trees
        run: npm run audit:prod

      - name: Verify generated type sources
        run: |
          make sync-types
          git diff --exit-code -- shared/stream-event.ts src/stream-event.types.ts web/src/stream-event.types.ts container/agent-runner/src/stream-event.types.ts
          npx prettier --check shared/stream-event.ts src/stream-event.types.ts web/src/stream-event.types.ts container/agent-runner/src/stream-event.types.ts

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build:all

      - name: Provider failure upstream smoke
        run: node tests/e2e/provider-failure-upstream.mjs fast

      - name: Codex gateway real SDK tool-loop smoke
        run: node tests/e2e/codex-gateway-sdk.mjs

      - name: Mobile browser interaction tests
        run: npm --prefix web run test:e2e

      - name: Agent runner self-test
        run: npm run self-test:agent-runner
